# ============================================================================
# Store Express - config.ini
# ----------------------------------------------------------------------------
# Read once at startup. Delete any line to fall back to the built in default.
# Amounts ending in _cents are whole cents, so 250000 is $2,500.00.
# ============================================================================

# ---- voices -----------------------------------------------------------------
# These are the voices of the PEOPLE in the building. Every customer and every
# member of staff is given one of them, so a shop full of people does not sound
# like one person. The game's own voice is not in here at all: the menus, the
# prompts and the reports are the player's own channel and go to the screen
# reader they are already listening with, at their own speed, or to a Windows
# voice when they have none running. See local speech at the end of this block.
#
# Every server in voice_endpoints is tried at startup, and EVERY one that
# answers adds its voices to the shop's pool, so the people in the shop do not
# all sound like one person. Each prefix must carry its own text parameter and
# leave it empty at the end, because the providers disagree about its name:
# Google Translate uses q= and ResponsiveVoice uses t=.
#
# None of these needs a key or an account. All three were tested from this
# project and answered HTTP 200 with real MPEG audio. They are unofficial
# endpoints, so they can rate limit or disappear. The voices already on this
# computer are in the pool whether or not a server answers - online and offline
# work together here, not one behind the other - so a server that goes quiet
# costs the shop variety, not its crowd.
#
# A family that answered is expanded into the voices it actually offers:
# Google into one per dialect in voice_google_dialects, ResponsiveVoice into one
# per locale in voice_responsive_locales. That is where the variety comes from,
# and each extra voice costs one URL and no extra setup.
voice_endpoints=https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=;https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en&q=;https://code.responsivevoice.org/getvoice.php?tl=en&sv=g1&pitch=0.5&rate=0.5&vol=1&t=
voice_google_dialects=en,en-gb,en-au,en-in,en-ie,en-za,en-ca
voice_responsive_locales=en,en-GB,en-AU,en-IN,en-US
voice_responsive_engines=g1,g2,g3
# Probe every server rather than stopping at the first one that answers. Turning
# this off costs the shop the voices of the servers after the first.
voice_probe_all=1
voice_probe_text=Store Express voice check.
voice_probe_timeout_ms=6000
# How long one spoken sentence may take to arrive before that voice is abandoned
# for the rest of the session. Speech is fetched in the background, so this never
# freezes the game; it only decides when a slow or silent server is given up on.
voice_fetch_timeout_ms=5000
# A sentence longer than this is fetched as several pieces and played back to
# back. Google's endpoint answers 400 above about 200 characters, and this game's
# own sentences run longer than that.
voice_chunk_chars=170

# ---- this computer's own voices ---------------------------------------------
# Characters can also be given the voices already installed on this computer,
# alongside the ones from the servers. That is what local_voices=1 does, and it
# is on by default: the shop's people should not all sound like one person.
#
# Asking NVGT for the installed voices enumerates every one of them, which
# measured 52 seconds on the development machine for 617 voices. That walk now
# runs on a worker thread while the shop is already open, so it costs the player
# nothing but background work: the game starts and talks as usual, and this
# computer's voices join the pool the moment they are ready, with a line to say
# so. SAPI5 is the engine asked for; on Windows that is the standard installed
# voice set, including any commercial voices bought for it.
local_voices=1
# Only voices whose name or language says English, out of the hundreds installed.
local_voices_english_only=1
local_voices_max=24
# NVGT engine names to ask, comma separated. Blank means every engine, which
# includes the awful built in fallback voice.
local_voice_engines=sapi5
# Two installed voices can be nearly identical, so these spread a small rate and
# pitch difference across them.
local_voice_rate_spread=0.12
local_voice_pitch_spread=0.08

# ---- local speech ----------------------------------------------------------
# The player's own channel: the menus, the prompts, the reports, and everything
# else the game says TO the player. It never uses one of the people's voices.
#
# screen_reader_preferred: use a running screen reader (NVDA, JAWS, etc.) rather
# than the built in voice, whenever one is available. That is the design and not
# a nicety: the player is already listening to their own screen reader at their
# own speed, so the interface speaks with it too. Set this to 0 to have the
# interface read out by a Windows voice on this computer instead.
screen_reader_preferred=1
# Also send the player's own lines to a braille display, when one is attached.
# The people in the building are never mirrored: braille is the interface, not
# the crowd.
braille_mirror=1

# ---- the main menu ---------------------------------------------------------
# While the main menu is up, the shop behind it keeps trading: the door, feet,
# the till, a customer or two talking, the office terminal, a delivery outside.
# It is a short script rather than a simulation - nothing is bought, nothing is
# paid for and no save is touched - and it is there so that a listener can hear
# what a store sounds like before starting one. Set this to 0 to have the main
# menu to itself, which is worth doing for a player who reads the menu with a
# screen reader and would rather not have a shop playing under it. The switch is
# also on the main menu's Options page, and pressing it there rewrites this line.
menu_demo_shop=1

# ---- clock -----------------------------------------------------------------
# In-game minutes that pass per real second.
#
# 0.25 is the reference's rate: one full shop day, seven in the morning to ten
# at night, per real hour. That makes a game hour about four real minutes, and a
# whole trading day fifteen real minutes.
#
# The clock stops entirely whenever the pause menu, the phone or the issue
# reporter is open, and customers' patience stops with it.
#
# The manager terminal is NOT one of those screens. Reading the reports, working
# out an order or watching a device install itself does not stop the day: the
# shop carries on trading behind you, which is the point of a store with a clock
# in it. See the hardware speech chips section at the end of this file.
minutes_per_real_second=0.25

# ---- jail ------------------------------------------------------------------
# Real milliseconds per simulated day served. Lower is faster.
jail_day_ms=300

# ---- the shop --------------------------------------------------------------
starting_cash_cents=250000
# What you tell the tax office you made, as a percentage of the week's real
# profit. Anything under 100 is under declaring, and every eight weeks there is
# a forty percent chance an audit finds it. You can change this on the terminal.
declared_profit_percent=100
# 0 none, 1 basic, 2 basic and half the stock, 3 basic and all the stock.
# The previous owner left you basic cover.
starting_insurance=1

# ---- audio -----------------------------------------------------------------
# Which speakers or headphones the game plays through. -1 follows whatever the
# system is set to, which is what a player who never touches it gets. 0 and up
# pick a device by the number shown in the main menu under Options, sound
# output, and the game rewrites this line when the player picks one there, so
# the choice survives the next launch. A machine with no device at all reads
# back as -1 whatever is written here.
sound_output_device=-1
default_beacon_gain_db=-2
# Volume in dB for beacons heard through a shared wall from an adjacent room.
# Beacons two rooms away are always completely silent.
muffle_gain_db=-22

# ---- asset bootstrap -------------------------------------------------------
# download_assets=1 fetches the real recordings listed in assets/manifest.txt on
# first run. The host rate limits bursts with HTTP 429, so requests are paced and
# retried; anything that still fails falls back to assets/placeholder/.
# The host is rate limited, so requests are spaced out. A first run therefore
# takes a few minutes; press Escape during it to skip the rest and keep playing.
download_assets=1
download_delay_ms=3000
download_retries=3
download_timeout_ms=45000

# ---- diagnostics -----------------------------------------------------------
# Start with diagnostic logging already on. You can also toggle it at any time
# with Control+Shift+R, and write a snapshot with Control+F1.
diagnostics_default=0

# ---- hardware speech chips -------------------------------------------------
# The machines in the building do not use the screen reader and do not use any
# installed voice. The back office terminal and the phone each have a speech chip
# of their own: an emulated Silicon Systems SSI-263, the chip that sat inside a
# whole family of talking boxes in the late 80s. The game renders it from the
# chip's own phoneme ROM, and these are the registers the host would have set on
# it. Nothing here needs a network, a key or a voice server: the chip is made out
# of arithmetic, so it cannot fail.
#
# A profile is how one chip differs from another. sample_rate is how fast the game
# takes the chip's output, filter_clock is the chip's R4: the tract's sections run
# at fc = 1 MHz / (2 (256 - FF)) and every formant is a fraction of it, so a lower
# clock makes a smaller, squawkier voice. rate is R2's speech rate (a frame is
# 4096 (16 - rate) cycles, so a higher number talks faster), articulation is R3's
# transition speed, amplitude is R3's 4 bit volume, pitch_hz is the pitch the host
# hands the chip, and glide is R1's inflection field. bits is the extra converter
# on the way out (0 leaves the chip's own 4 bit volume alone), dropout_pct is how
# often it loses a block of audio entirely, hiss_pct is a little noise floor, and
# amp_pct is how loud a finished line comes out.
#
# The terminal runs at the clock its ROM was checked against: at 20 kHz the
# decoded vowels land where vowels live. The phone sits at 17 kHz with a 5 bit
# converter and a few lost blocks: a cheap handset, small and bright, but every
# vowel still lands in speech, because the player has to understand what it says.
# It used to run at 9 kHz and 3 bits, which put every formant below half where it
# belongs and made whole words unrecognisable. Raising chip_computer_bits to 4 and
# its dropout to 8 makes the terminal's converter fall apart.
chip_computer_sample_rate=11025
chip_computer_filter_clock=231
chip_computer_rate=6
chip_computer_articulation=4
chip_computer_amplitude=15
chip_computer_pitch_hz=104
chip_computer_glide=0
chip_computer_oversample=2
chip_computer_bits=0
chip_computer_hiss_pct=3
chip_computer_dropout_pct=0
chip_computer_amp_pct=100
chip_phone_sample_rate=8000
chip_phone_filter_clock=227
chip_phone_rate=6
chip_phone_articulation=4
chip_phone_amplitude=14
chip_phone_pitch_hz=132
chip_phone_glide=1
chip_phone_oversample=2
chip_phone_bits=5
chip_phone_hiss_pct=6
chip_phone_dropout_pct=3
chip_phone_amp_pct=100
# How fast each machine talks and what note it talks at is deliberately NOT here.
# The speed and the pitch are the player's own settings and they are kept in the
# save they were set in, not in this file: a store's machines talk the way that
# store's player left them, and loading a different slot puts that slot's speed
# and pitch back on the machines. Each machine has a Speech speed: line and a
# Pitch: line on its own home page - the manager terminal's and the phone's -
# and a new store starts both machines at 65 per cent of normal speed and 100
# per cent of their own pitch.
# How loud the chips sit against everything else, in decibels.
chip_volume_db=-5
# chip_mirror_lines=0 is the default and the intended way to play: a machine
# says what it has to say in its own voice and nobody repeats it. Set it to 1 and
# every chip line is read out again half a second later in the voice that reads
# the menus, which is a crutch for a player who cannot follow a chip voice at
# all. Nothing else about a device changes either way.
chip_mirror_lines=0
# How hard the renderer works per frame. The line is written a slice at a time
# while the shop keeps trading; raising these makes a chip line start sooner and
# costs the frame more, lowering them does the reverse.
chip_samples_per_frame=2600
chip_render_budget_ms=2